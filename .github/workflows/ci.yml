name: CI Pipeline - Code Quality & Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Test & Pipeline Verification (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare environment configuration
        run: |
          cp .env.example .env
          mkdir -p data/raw data/processed artifacts/models logs

      - name: Static syntax and compilation check
        run: |
          python -m compileall src/ app/ scripts/ tests/

      - name: Run automated pytest test suite
        env:
          DATABASE_URL: sqlite:///./data/ecommerce.db
          GEMINI_API_KEY: mock_api_key_for_ci
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          pytest tests/ -v

      - name: End-to-End pipeline smoke test (SQLite)
        env:
          DATABASE_URL: sqlite:///./data/ecommerce.db
          GEMINI_API_KEY: mock_api_key_for_ci
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          echo "==> 1. Generating & ingesting synthetic demo transactions"
          python scripts/seed_demo_data.py --records 200 --ingest

          echo "==> 2. Training customer churn classifier"
          python scripts/train_model.py --version v1.0.0 --horizon-days 60 --lookback-days 180

          echo "==> 3. Generating and persisting churn predictions"
          python scripts/generate_predictions.py --version v1.0.0

          echo "==> 4. Verifying generated model artifacts"
          test -f artifacts/models/churn_model_v1.0.0.joblib
          test -f artifacts/models/churn_model_v1.0.0_metadata.json
